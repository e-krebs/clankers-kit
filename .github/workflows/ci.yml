name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck setup.sh uninstall.sh .claude/hooks/*.sh

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check jq is available
        run: jq --version
      - name: Run setup.sh non-interactively in a sandbox HOME
        run: |
          SANDBOX="$(mktemp -d)"
          HOME="$SANDBOX" bash setup.sh --yes --no-private \
            --name CI --role Tester \
            --presets allowlist,enforcement,notification
          test -L "$SANDBOX/.claude/settings.json"
          test -L "$SANDBOX/.claude/CLAUDE.md"
          test -L "$SANDBOX/.claude/hooks"
          test -L "$SANDBOX/.claude/projects"
          jq -e . "$SANDBOX/.claude/settings.json" > /dev/null
          echo "setup smoke test passed on ${{ matrix.os }}"

          # uninstall should replace the symlinks with real files/dirs (content preserved)
          HOME="$SANDBOX" bash uninstall.sh --yes
          test ! -L "$SANDBOX/.claude/settings.json" && test -f "$SANDBOX/.claude/settings.json"
          test ! -L "$SANDBOX/.claude/hooks"         && test -d "$SANDBOX/.claude/hooks"
          test ! -L "$SANDBOX/.claude/projects"      && test -d "$SANDBOX/.claude/projects"
          jq -e . "$SANDBOX/.claude/settings.json" > /dev/null
          echo "uninstall restored real files on ${{ matrix.os }}"
