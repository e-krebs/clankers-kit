name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        # every tracked .sh, so a new hooks/lib or skills/*/hooks script is covered without a glob edit
        run: shellcheck $(git ls-files '*.sh')
      - name: Lint the manifest
        run: bash .agents/lint-manifest.sh
      - name: Check the local overrides
        run: bash .agents/check-local-overrides.sh "$GITHUB_WORKSPACE"
      - name: Run the hook fixtures
        run: bash .agents/hooks/run-fixtures.sh
      - name: Test the manifest lint
        run: bash .agents/test-lint-manifest.sh
      - name: Test set-state
        run: bash .agents/skills/execute-plan/scripts/test-set-state.sh

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check jq is available
        run: jq --version
      - name: Run setup.sh and uninstall.sh against throwaway HOMEs
        run: bash .github/smoke.sh
